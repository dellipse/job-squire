name: CLI

# job_squire_cli/ is its own installable package with its own pyproject.toml
# (see docs/job-squire-cli.md), so it gets its own lint+test+SBOM pipeline
# here rather than folding into ci.yml's app-focused jobs. Ruff itself still
# runs on this package via ci.yml's root `ruff check .` -- ruff resolves
# job_squire_cli/pyproject.toml's [tool.ruff] table for files under that
# directory even when invoked from the repo root, so linting isn't
# duplicated here.
#
# python-version below is intentionally pinned to 3.11, not the 3.14 that
# ci.yml and the app's container runtime use (see the Dockerfile's FROM
# comment). job_squire_cli is a pip-distributed *host* CLI (installed by
# bootstrap.sh onto a user's own machine, e.g. via `pipx install`), not code
# that runs inside the container, so its compatibility floor is a product
# decision, not CI drift: job_squire_cli/pyproject.toml declares
# `requires-python = ">=3.11"` so users who haven't upgraded their host
# Python can still install and run it, and its own [tool.ruff] table sets
# target-version = "py311" to match. This job tests against that same 3.11
# floor -- the actual minimum this package promises to support -- rather
# than an arbitrary version in between (audit CI-04, 2026-09-08 follow-up:
# the previous "3.12" here matched neither the declared floor nor the app
# runtime and had no documented reason). ruff's *version* (not its
# target-version) is still kept in lockstep with requirements-dev.txt's pin
# below -- there's no compatibility reason for the linter tool itself to
# drift between workflows, only for the Python floor it's checking against.
on:
  push:
    branches: [main]
    paths:
      - "job_squire_cli/**"
      - "scripts/stamp_cli_version.py"
      - ".github/workflows/cli.yml"
  pull_request:
    paths:
      - "job_squire_cli/**"
      - "scripts/stamp_cli_version.py"
      - ".github/workflows/cli.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install job-squire-cli with the query extra, plus dev tools
        run: |
          pip install -e "./job_squire_cli[query]"
          pip install pytest==9.1.1 pytest-cov==7.1.0 ruff==0.16.6 pip-audit==2.10.1

      # actions/setup-python's cached 3.11.16 build bundles an old setuptools
      # (79.0.1) via ensurepip, vulnerable to PYSEC-2026-3447 (fixed 83.0.0).
      # The 3.14 build ci.yml uses doesn't carry this -- only surfaced here
      # once this job actually started testing against the 3.11 floor (see
      # the header comment above; audit CI-04 follow-up, 2026-09-09). Same
      # fix the root Dockerfile already applies to its own venv for the same
      # class of stale-bundled-setuptools CVE: upgrade it explicitly rather
      # than leaving whatever ensurepip shipped.
      - name: Upgrade setuptools (bundled build is CVE-flagged on 3.11)
        run: pip install --upgrade setuptools

      - name: Ruff check
        run: ruff check job_squire_cli

      - name: Run tests
        run: cd job_squire_cli && pytest -q

      - name: Audit installed dependencies for known CVEs
        run: pip-audit --skip-editable

  # Deployment-only install: prove the [query] extra is truly optional --
  # the ops commands and the console entry points must work without rich
  # or mcp anywhere on the machine.
  test-without-query-extra:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install job-squire-cli without the query extra
        run: pip install -e ./job_squire_cli

      - name: Both entry points resolve and the deployment group works
        run: |
          job-squire --help
          jobsquire --version
          ! job-squire create 2>&1 | grep -qi traceback

      - name: The query group fails with an actionable message, not a traceback
        run: |
          output="$(job-squire query health 2>&1 || true)"
          echo "$output"
          echo "$output" | grep -qi "\[query\] extra"
          ! echo "$output" | grep -qi traceback

  sbom:
    needs: [test, test-without-query-extra]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Stamp CLI version from VERSION + short SHA
        run: python scripts/stamp_cli_version.py

      - name: Install job-squire-cli + SBOM generator
        run: |
          pip install -e "./job_squire_cli[query]"
          pip install cyclonedx-bom

      - name: Generate SBOM
        run: cd job_squire_cli && python scripts/generate_sbom.py

      # Uploaded as a build artifact rather than committed back to git --
      # job_squire_cli/sbom/job-squire-cli.cdx.json was never actually
      # tracked in the repo, so `git diff --quiet` against it always
      # exited 0 and this job silently never committed anything (the same
      # shape of bug PR #34 fixed for ci.yml's image SBOM). Unlike the
      # image SBOM, job-squire-cli is a pip package, not an OCI image --
      # there's no published digest for `cosign attest` to sign, so that
      # exact mechanism doesn't transfer. This is the adapted equivalent:
      # the CI-produced file itself is the canonical artifact, attached to
      # the run that produced it, rather than a copy hand-committed back
      # to a branch. See job_squire_cli/sbom/README.md.
      - name: Upload SBOM as a build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: job-squire-cli-sbom
          path: job_squire_cli/sbom/job-squire-cli.cdx.json
          retention-days: 90
