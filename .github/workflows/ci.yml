name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff check
        # Formatting (ruff format) is intentionally not gated yet — the
        # codebase predates ruff and hasn't been swept for formatting, and
        # reformatting ~25 files in the same change that introduces the gate
        # is too large a diff to review safely. Lint rules (real bugs, not
        # style) are gated now; formatting can be ratcheted in separately.
        run: ruff check .

      - name: Ruff format check (advisory)
        # CI-03 (2026-09-08 audit): visibility into formatting drift without
        # blocking on the pre-existing sweep this repo hasn't done yet (see
        # the comment above). Promote to a hard gate once a real formatting
        # pass lands and this has been quiet for a cycle.
        continue-on-error: true
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests under coverage
        # The test suite is self-contained: tests/conftest.py sets SECRET_KEY,
        # a temp DATA_DIR, and seed passwords itself, so no secrets are needed.
        run: coverage run --source=app -m pytest -q

      - name: Coverage report
        run: coverage report --show-missing

      - name: Enforce overall coverage floor
        # Ratchet: raise this as coverage of the remaining modules (ai, main,
        # worker, notify, websearch) is added. Measured 57% at this pass
        # (TEST-01: route smoke tests for the previously-untested
        # destructive/admin routes, plus test_worker.py).
        run: coverage report --fail-under=50

      - name: Enforce critical-module coverage floor
        # The security- and correctness-critical surfaces carry a higher bar:
        # crypto + auth are fully covered; mcp_server (the public OAuth server),
        # providers, and search sit well above this floor. Measured 61%.
        run: >
          coverage report --fail-under=58
          --include="app/crypto.py,app/auth.py,app/mcp_server.py,app/providers.py,app/search.py"

  pip-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install pip-audit
        run: pip install pip-audit==2.10.1

      - name: Audit pinned dependencies for known CVEs
        run: pip-audit -r requirements.txt -r requirements-dev.txt

  # ── Advisory-only gates (CI-03, 2026-09-08 audit) ──────────────────────
  # None of the jobs below are wired into build-and-publish's `needs:` --
  # they report findings (in-log, or to the Security tab for tools that
  # support SARIF) without blocking anything, matching how the Trivy scan
  # above is already split into an advisory full-report pass and a
  # separate blocking pass for fixable CRITICAL/HIGH CVEs only. Promote
  # any of these to a required check (branch protection +
  # build-and-publish's needs:) once it's been quiet on this codebase for
  # a cycle.

  mypy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies + mypy
        run: |
          pip install -r requirements-dev.txt
          pip install mypy==1.19.1

      - name: Type check (permissive/gradual mode, advisory)
        # See [tool.mypy] in pyproject.toml for what "permissive" means here
        # -- no --strict, no untyped-def checking. The codebase carries
        # almost no type annotations today; this is visibility into what's
        # already annotated (and obviously wrong) rather than a coverage
        # requirement.
        continue-on-error: true
        run: mypy app/

  bandit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install bandit
        run: pip install bandit==1.9.2

      - name: Python SAST (advisory)
        # Complements CodeQL (codeql.yml) rather than replacing it --
        # bandit's ruleset is Python-specific and catches some
        # framework/crypto-misuse patterns CodeQL's generic queries don't.
        continue-on-error: true
        run: bandit -r app/ job_squire_cli/job_squire_cli -f screen

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Gitleaks (advisory)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gitleaks-action's default behavior on a finding is to fail the
          # step (and, on a public repo, open a GitHub Security Advisory
          # draft) -- GITLEAKS_ENABLE_COMMENTS off since this isn't wired
          # to comment on PRs, and continue-on-error above is the actual
          # advisory boundary regardless of the action's own exit code.
          GITLEAKS_ENABLE_COMMENTS: "false"

  actionlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install actionlint (pinned release, checksum-verified)
        run: |
          set -e
          version="1.7.12"
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_checksums.txt"
          grep "actionlint_${version}_linux_amd64.tar.gz\$" "actionlint_${version}_checksums.txt" | sha256sum -c -
          tar xzf "actionlint_${version}_linux_amd64.tar.gz" actionlint

      - name: Lint workflow files (advisory)
        continue-on-error: true
        run: ./actionlint -color

  hadolint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint Dockerfile (advisory)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        continue-on-error: true
        with:
          dockerfile: Dockerfile

  build-and-publish:
    # Gate: this job only runs after lint, test, and pip-audit all pass, and
    # only for pushes to main — not for pull_request events (fork PRs have no
    # access to GHCR credentials anyway, and shouldn't be building/pushing).
    needs: [lint, test, pip-audit]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      # contents: read is enough now that this job no longer pushes a commit
      # back to main (see the "Attest SBOM" step's comment below).
      contents: read
      packages: write
      id-token: write
      security-events: write
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read app version
        run: echo "APP_VERSION=$(cat VERSION)" >> $GITHUB_ENV

      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Set up QEMU (emulation for the non-native arch under buildx)
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # Validates that both platforms actually build (musllinux wheels must
      # resolve for arm64, not just the runner's native amd64) before we
      # spend time on the scan/push steps below. push:false and no `load`
      # here is deliberate: buildx's docker exporter can't `--load` a
      # multi-platform result into the local daemon at all (there's no
      # single image to load — only a manifest list), so this step builds
      # to the GHA cache only and discards the result. The scan step right
      # after this one separately builds+loads a single native-arch image
      # for Trivy, which needs one concrete image to scan; a manifest list
      # isn't a valid scan target and CVE data doesn't meaningfully vary by
      # CPU arch for the same package versions, so scanning both platforms
      # here would double this job's runtime for no real coverage gain.
      - name: Validate multi-platform build (cache-only, no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            BUILD_VERSION=${{ env.APP_VERSION }}-${{ env.SHORT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build image (local only — not pushed until it clears the scan)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: job-squire:scan
          build-args: |
            BUILD_VERSION=${{ env.APP_VERSION }}-${{ env.SHORT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image (full report, non-blocking, uploaded to Security tab)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: job-squire:scan
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Upload scan results to code scanning
        # Advisory only — must never block the release.
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        if: always()
        with:
          sarif_file: trivy-results.sarif

      - name: Scan image (gate — fails the build on fixable CRITICAL/HIGH CVEs)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: job-squire:scan
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Build and push image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          build-args: |
            BUILD_VERSION=${{ env.APP_VERSION }}-${{ env.SHORT_SHA }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # steps.push.outputs.digest is the image *index* (manifest list)
      # digest when platforms is multi-valued, not a single-platform
      # digest — build-push-action pushes each per-platform image, then
      # the index, and reports the index's digest. cosign sign/attest
      # below sign that index digest directly, and cosign's default
      # behavior is to sign the top-level manifest of a multi-arch image,
      # so no --platform/--recursive flag is needed to cover both arches.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign published image (keyless, via GitHub OIDC)
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            cosign sign --yes "${tag}@${DIGEST}"
          done <<< "$TAGS"

      - name: Set up Python for SBOM generation
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install app + SBOM deps
        run: |
          pip install -r requirements.txt
          pip install cyclonedx-bom

      - name: Generate SBOM
        run: python scripts/generate_sbom.py

      - name: Attest SBOM to the published image
        # This attestation -- signed, and cryptographically tied to the exact
        # digest that just got pushed -- is the SBOM's canonical, verifiable
        # home (`cosign verify-attestation` / `docker buildx imagetools
        # inspect`). A previous version of this job also committed the same
        # file to sbom/job-squire.cdx.json in the repo for convenience, but
        # that copy carried no integrity guarantee (a plain JSON file anyone
        # with write access could hand-edit, not tied to any specific image
        # build) and had gone silently stale for weeks whenever this job
        # failed a step upstream (see git history / job-squire-audit-
        # 2026-09-08.md's DEP-01 finding). It also couldn't be committed
        # directly to protected main at all once branch protection started
        # requiring lint/test/pip-audit to pass on every ref update, since
        # this step's [skip ci] commit could never produce those checks on
        # its own SHA (confirmed 2026-09-08: 5/5 retries rejected on the
        # first run that got far enough to reach this step). Dropped rather
        # than worked around -- see sbom/README.md.
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign attest --yes \
            --predicate sbom/job-squire.cdx.json \
            --type cyclonedx \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}"
