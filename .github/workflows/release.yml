name: Release

# Cuts a GitHub Release (and its tag) whenever VERSION changes on main. This
# job reads VERSION -- it never writes it; bumping VERSION and adding the
# matching CHANGELOG.md section is still a manual "CHORE: Bump version to
# X.Y.Z" commit (see docs/job-squire-cli.md "Versioning").
#
# Pre-1.0.0 policy: every release this job creates is marked --prerelease
# as long as VERSION's major version is 0 (all 0.x.y releases are betas).
# GitHub does not allow a prerelease to also be flagged "Latest release" --
# POST/PATCH /releases returns 422 "Latest release cannot be draft or
# prerelease" if you try -- so none of these will show the "Latest" badge
# on the repo's Releases page while VERSION stays 0.x.y. That's expected,
# not a bug: bootstrap.sh already has a fallback for exactly this case
# (GET /releases/latest 404s when nothing qualifies, so it falls back to
# GET /releases -- newest first -- and installs that one, with a warning).
# The first release with a major version >= 1 stops passing --prerelease
# automatically and becomes the repo's real "Latest" release.

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history + tags, so the "already tagged" check below is
          # reliable rather than working off a shallow clone that might be
          # missing older tags.
          fetch-depth: 0

      - name: Read version
        run: echo "VERSION=$(cat VERSION)" >> "$GITHUB_ENV"

      - name: Skip if this version is already tagged
        id: check
        run: |
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "v${VERSION} already exists -- nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract this version's CHANGELOG section
        if: steps.check.outputs.exists == 'false'
        run: |
          python3 - "$VERSION" <<'PY' > release_notes.md
          import re, sys
          version = sys.argv[1]
          text = open("CHANGELOG.md").read()
          pattern = re.compile(
              rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)",
              re.MULTILINE | re.DOTALL,
          )
          m = pattern.search(text)
          if not m:
              sys.exit(
                  f"No CHANGELOG.md section found for [{version}]. "
                  "Add one in the same commit that bumps VERSION before merging."
              )
          print(m.group(1).strip())
          PY

      - name: Decide prerelease flag from VERSION's major component
        if: steps.check.outputs.exists == 'false'
        run: |
          major="${VERSION%%.*}"
          if [ "$major" = "0" ]; then
            echo "PRERELEASE_FLAG=--prerelease" >> "$GITHUB_ENV"
          else
            echo "PRERELEASE_FLAG=" >> "$GITHUB_ENV"
          fi

      # Without this, job_squire_cli/pyproject.toml's committed `version =
      # "..."` stays whatever was last hand-stamped (historically, stale for
      # months at a time -- see docs/job-squire-cli.md "Versioning") and
      # `job-squire --version` reports that stale value on every fresh
      # bootstrap.sh install, regardless of which commit/release actually
      # got installed. scripts/stamp_cli_version.py was only ever wired
      # into .github/workflows/cli.yml's own lint/test run, which never
      # commits its result -- this is the one place that both has
      # `contents: write` and unconditionally runs whenever VERSION changes,
      # so it's the right place to make the stamp durable. The tag/release
      # below is retargeted at this new commit (not the triggering one),
      # since that's the commit whose pyproject.toml actually carries the
      # correct value.
      #
      # CI-01 (2026-09-08 audit): this used to `git commit` and
      # `git push origin HEAD:main` directly, with a 5-attempt
      # fetch+rebase retry loop for when something else raced it onto main
      # first (confirmed happening 2026-07-17/18 against ci.yml's old SBOM-
      # commit step, since removed -- see #34). Branch protection on main
      # requires `lint`/`test`/`pip-audit` to have passed
      # (required_status_checks, strict: false) but has no
      # required_pull_request_reviews and no push `restrictions` -- so it
      # does NOT scope direct pushes to this bot's identity specifically,
      # and since required status checks are a PR-*merge*-time gate (not a
      # push-time one) in this repo's protection config, a direct push
      # bypassed them entirely regardless of who made it. This step now
      # opens a PR and lets GitHub's own native auto-merge (already enabled
      # repo-wide) gate the merge on those same required checks instead of
      # racing a direct push against anything else that might land on main
      # in the same window -- the race this retry loop patched around is
      # structurally gone, not just handled better.
      #
      # Pushing the branch and opening the PR with RELEASE_BOT_TOKEN (a
      # fine-grained PAT, repo-scoped to Contents+PRs write, added as a
      # repo secret 2026-09-09) rather than the default GITHUB_TOKEN is
      # required, not stylistic: GitHub suppresses new workflow runs
      # (including ci.yml's `pull_request` trigger) for anything created
      # using the GITHUB_TOKEN, specifically to prevent workflow-triggers-
      # workflow recursion. Without this, lint/test/pip-audit would never
      # run on the bot's PR, auto-merge would wait on required checks that
      # never arrive, and every release would hang until the timeout below
      # fires. The PAT makes the push/PR look like a normal authored
      # change, so ci.yml triggers on it exactly like it would for a human.
      # Everything past this step (tagging, the release itself) still uses
      # the default token. Rotate RELEASE_BOT_TOKEN before its 1-year
      # expiration (set 2026-09-09) or this step starts failing outright.
      - name: Stamp CLI version and open an auto-merge PR
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
        run: |
          set -e
          python3 scripts/stamp_cli_version.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add job_squire_cli/pyproject.toml
          if git diff --cached --quiet; then
            echo "job_squire_cli/pyproject.toml already stamped correctly -- nothing to commit."
            echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          else
            branch="bot/stamp-cli-version-v${VERSION}"
            git commit -m "CHORE: Stamp job-squire-cli version for v${VERSION}"
            # actions/checkout persists its own (default-token) credential as
            # an `http.extraheader` -- unset it before pointing the remote at
            # RELEASE_BOT_TOKEN instead, so git doesn't send two conflicting
            # Authorization headers on this push.
            git config --unset-all "http.https://github.com/.extraheader" || true
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push origin "HEAD:refs/heads/${branch}" --force

            existing_pr="$(gh pr list --head "$branch" --state open --json url -q '.[0].url // empty')"
            if [ -n "$existing_pr" ]; then
              pr_url="$existing_pr"
            else
              pr_url="$(gh pr create --title "CHORE: Stamp job-squire-cli version for v${VERSION}" \
                --body "Automated version-stamp commit ahead of the v${VERSION} release. Auto-merges once lint/test/pip-audit pass." \
                --base main --head "$branch")"
            fi
            gh pr merge "$pr_url" --auto --squash

            echo "PR_URL=$pr_url" >> "$GITHUB_ENV"
            echo "NEEDS_MERGE_WAIT=true" >> "$GITHUB_ENV"
          fi

      - name: Wait for the version-stamp PR to merge
        if: steps.check.outputs.exists == 'false' && env.NEEDS_MERGE_WAIT == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          for _ in $(seq 1 30); do
            state="$(gh pr view "$PR_URL" --json state -q .state)"
            if [ "$state" = "MERGED" ]; then
              sha="$(gh pr view "$PR_URL" --json mergeCommit -q .mergeCommit.oid)"
              echo "RELEASE_SHA=$sha" >> "$GITHUB_ENV"
              exit 0
            fi
            if [ "$state" = "CLOSED" ]; then
              echo "Version-stamp PR ($PR_URL) was closed without merging -- aborting release." >&2
              exit 1
            fi
            sleep 20
          done
          echo "Version-stamp PR ($PR_URL) did not auto-merge within 10 minutes -- aborting release. Check whether lint/test/pip-audit passed on it." >&2
          exit 1

      - name: Create tag and GitHub Release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --notes-file release_notes.md \
            --target "${RELEASE_SHA}" \
            $PRERELEASE_FLAG
