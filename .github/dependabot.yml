version: 2
updates:
  # Application + dev dependencies (requirements.txt, requirements-dev.txt).
  # Grouped into one PR a week so a single-maintainer project isn't buried
  # in individual bump PRs; pip-audit in CI still catches anything urgent
  # between Dependabot runs.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        patterns:
          - "*"
    ignore:
      # pydantic and pydantic-core ship as a matched pair: every pydantic
      # release hard-pins one exact pydantic-core version (2.13.4 -> 2.46.4,
      # 2.13.5 -> 2.46.5). Dependabot versions them independently, so pinning
      # only one half makes `pip install` unresolvable in EITHER direction:
      #   - core bumped alone            -> PRs #6, #8, #19
      #   - pydantic bumped, core frozen -> PR #21 (ignoring core alone was
      #     not enough; that is why both are listed here)
      # Because every pip update lands in the single group above, one bad pin
      # also blocks every unrelated update riding along with it — #19 took
      # eight healthy bumps down with it.
      # Move the pair together, by hand, when a new pydantic release lands.
      # Context: the note above these pins in requirements.txt.
      - dependency-name: "pydantic"
      - dependency-name: "pydantic-core"
      # mcp 1.x -> 2.x was a rewrite, not a bump (FastMCP -> MCPServer, httpx ->
      # httpx2, CallToolResult field renames -- see the comment above the pin
      # in requirements.txt); the SDK's own VERSIONING.md reserves breaking
      # changes for majors, so block the major generically and audit the
      # migration guide by hand before lifting this for the next one.
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "CHORE"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "CHORE"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "CHORE"
