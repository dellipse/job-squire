[tool.ruff]
# Matches the app's actual runtime floor: the container only ever runs one
# Python version (the Dockerfile's base image, currently 3.14 -- see its FROM
# comment), and ci.yml's lint/test/pip-audit jobs test against that same
# version. Unlike job_squire_cli (a separately pip-distributed host tool with
# its own, older, requires-python floor -- see job_squire_cli/pyproject.toml),
# there's no separate host-compatibility concern here to justify targeting an
# older syntax floor (audit CI-04, 2026-09-08 follow-up: this was previously
# "py312", stale from before the Dockerfile moved to 3.14).
target-version = "py314"
line-length = 110

[tool.ruff.lint]
# Default rule set (E4, E7, E9, F) — real bugs and syntax errors, not style opinions.
# Kept intentionally small so the gate stays high-signal for a single-maintainer
# project; broaden (e.g. add I, UP, B) once the codebase has been swept for those.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# main.py and mcp_server.py define a logger (and, in mcp_server.py, rate-limit
# state) before importing sibling modules that log at import time / would
# otherwise risk circular imports. The reordering is deliberate.
"app/main.py" = ["E402"]
"app/mcp_server.py" = ["E402"]

[tool.mypy]
# Gradual/permissive mode (CI-03, 2026-09-08 audit): ci.yml's mypy job is
# advisory-only while the codebase carries almost no type annotations --
# no --strict, no untyped-def checking. This is visibility into what's
# already annotated (and obviously wrong), not a coverage requirement.
# Tighten per-module once the advisory run has been quiet for a cycle.
python_version = "3.14"
ignore_missing_imports = true
